<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LabSteam</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="topbar">
            <div class="logo">
                <img src="./steam-logo.png" alt="Logo Steam">
            </div>
            <nav>
                <a href="#">Tenda</a>
                <a href="#">Notícies</a>
                <a href="#">Comunitat</a>
                <a href="#">Sobre Steam</a>
                <a href="#">Assistència</a>
            </nav>
        </div>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h1>Descobreix nous jocs</h1>
            <p>Descomptes, novetats i els jocs més venuts</p>
            <a href="https://drive.google.com/drive/folders/1tjQC-mPEPIgEPXU16eBvWJeeiDumV-X0?usp=sharing"><button>Explora ara</button>
        </div>
    </section>

    <main>
        <h2 class="section-title">Recomanats per a tu</h2>
        <div class="card-grid">
            <div class="card">
                <img src="./lol.jpg" alt="Joc 1">
                <div class="card-info">
                    <h3>League of Legends</h3>
                    <p class="price">19,99€</p>
                </div>
            </div>
            <div class="card">
                <img src="./valorant.jpg" alt="Joc 2">
                <div class="card-info">
                    <h3>Valorant</h3>
                    <p class="price">Gratis</p>
                </div>
            </div>
            <div class="card">
                <img src="./minecraft.jpg" alt="Joc 3">
                <div class="card-info">
                    <h3>Minecraft</h3>
                    <p class="price">14,99€</p>
                </div>
            </div>
            <div class="card">
                <img src="./fifa.jpg" alt="Joc 4">
                <div class="card-info">
                    <h3>FIFA 2025</h3>
                    <p class="price">9,99€</p>
                </div>
            </div>
            <div class="card">
                <img src="./gta.jpg" alt="Joc 4">
                <div class="card-info">
                    <h3>Grand Theft Auto VI</h3>
                    <p class="price">49,99€</p>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
