<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix</title>
    <link rel="icon" type="image/x-icon" href="./imgs/netflix.ico">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <a href="#" class="logo">
            <img src="./imgs/netflix-logo.png" alt="Netflix">
        </a>

        <nav class="navigation">
            <a href="#">Inici</a>
            <a href="#">Sèries</a>
            <a href="#">Pel·lícules</a>
            <a href="#">Jocs</a>
            <a href="#">Novetats més vistes</a>
            <a href="#" class="my-netflix">Mi Netflix</a>
            <a href="#">Explorar per idiomes</a>
        </nav>

        <div class="header-actions">
            <button aria-label="Cercar" class="icon-button">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="11" cy="11" r="7"></circle>
                    <path d="m16 16 5 5"></path>
                </svg>
            </button>

            <button aria-label="Notificacions" class="icon-button notification-button">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
                    <path d="M10 21h4"></path>
                </svg>
                <span class="notification-dot"></span>
            </button>
            <img src="./imgs/user.png" alt="Perfil" class="avatar">
        </div>
    </header>

    <main>
        <section class="content-section">
            <h2>Seguir veient</h2>
            <div class="movie-row">
                <article class="movie-card">
                    <img src="./imgs/deathnote.png" alt="League of Legends">
                    <div class="progress"><span style="width: 78%"></span></div>
                </article>
                <article class="movie-card">
                    <img src="./imgs/hunterxhunter.png" alt="Valorant">
                    <div class="progress"><span style="width: 55%"></span></div>
                </article>
                <article class="movie-card">
                    <img src="./imgs/sailormoon.png" alt="Minecraft">
                    <div class="progress"><span style="width: 70%"></span></div>
                </article>
                <article class="movie-card">
                    <img src="./imgs/dragonballz.png" alt="FIFA">
                    <div class="progress"><span style="width: 45%"></span></div>
                </article>
                <article class="movie-card">
                    <img src="./imgs/thesevendeadlysins.png" alt="Grand Theft Auto">
                    <div class="progress"><span style="width: 90%"></span></div>
                </article>
                <article class="movie-card">
                    <img src="./imgs/jujutsukaisen.png" alt="League of Legends">
                    <div class="progress"><span style="width: 30%"></span></div>
                </article>
            </div>
        </section>

        <section class="content-section">
            <h2>La meva llista</h2>
            <div class="movie-row">
                <article class="movie-card">
                    <img src="./imgs/demonslayer.png" alt="demonslayer">
                </article>
                <article class="movie-card">
                    <img src="./imgs/neongenesisevangelion.png" alt="neongenesisevangelion">
                </article>
                <article class="movie-card">
                    <img src="./imgs/bluelock.png" alt="Minecraft">
                    <span class="new-label">Recentment afegit</span>
                </article>
                <article class="movie-card">
                    <img src="./imgs/myheroacademia.png" alt="FIFA">
                </article>
                <article class="movie-card">
                    <img src="./imgs/jojos.png" alt="Grand Theft Auto">
                </article>
                <article class="movie-card">
                    <img src="./imgs/baki.png" alt="Valorant">
                </article>
            </div>
        </section>

        <section class="content-section">
            <h2>Tràilers que has vist</h2>
            <div class="movie-row">
                <article class="movie-card">
                    <img src="./imgs/smallville.png" alt="Tràiler de Valorant">
                </article>
                <article class="movie-card">
                    <img src="./imgs/breakingbad.png" alt="Tràiler de GTA">
                </article>
                <article class="movie-card">
                    <img src="./imgs/elmentalista.png" alt="Tràiler de Minecraft">
                </article>
                <article class="movie-card">
                    <img src="./imgs/cronicasvampiricas.png" alt="Tràiler de League of Legends">
                </article>
                <article class="movie-card">
                    <img src="./imgs/blackmirror.png" alt="Tràiler de FIFA">
                </article>
                <article class="movie-card">
                    <img src="./imgs/psycho.png" alt="Tràiler de GTA">
                </article>
            </div>
        </section>
    </main>
</body>
</html>
